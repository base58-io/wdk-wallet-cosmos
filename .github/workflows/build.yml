name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `tsc` runs strict checkJs over index.js, src/ and tests/, and emits the
      # published declarations. Same command `prepublishOnly` runs.
      - run: npm run build:types

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Offline suite only. `test:integration` needs the local Ignite chains
      # from docker-compose.yml and is run by hand.
      - run: npm test
