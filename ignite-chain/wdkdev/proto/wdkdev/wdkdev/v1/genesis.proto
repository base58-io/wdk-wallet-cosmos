syntax = "proto3";
package wdkdev.wdkdev.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "wdkdev/wdkdev/v1/params.proto";

option go_package = "wdkdev/x/wdkdev/types";

// GenesisState defines the wdkdev module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
